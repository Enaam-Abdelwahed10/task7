<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إنشاء فاتورة</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 dark:bg-slate-900 dark:text-slate-200"></body>
<div class="max-w-2xl mx-auto p-4 space-y-4">
  <div class="flex items-center justify-between gap-3">
    <h1 class="text-xl font-bold">إنشاء فاتورة</h1>
    <button id="crossingBtn" type="button" class="px-4 py-2 rounded-lg bg-red-600 hover:bg-red-700 text-white font-semibold">سكر المعبر</button>
  </div>
  <div id="crossingBanner" class="hidden rounded-lg bg-red-100 text-red-800 dark:bg-red-900/40 dark:text-red-200 px-4 py-2 text-sm">
    المعبر مسكّر: كل الأسعار * 150%
  </div>
  <div class="rounded-xl bg-white dark:bg-slate-800 shadow p-4 space-y-3">
    <div id="rows" class="space-y-2"></div>
    <p id="err" class="hidden text-sm text-red-600">أضف منتج واحد على الأقل مع سعره.</p>
    <button id="createBtn" type="button" class="w-full py-2.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-semibold">إنشاء فاتورة</button>
  </div>
  <div id="invoice" class="hidden rounded-xl bg-white dark:bg-slate-800 shadow p-4 space-y-3">
    <h2 class="text-lg font-bold">الفاتورة</h2>
    <div class="overflow-x-auto">
      <table class="w-full text-right">
        <thead>
          <tr class="border-b border-slate-200 dark:border-slate-600 text-sm text-slate-500 dark:text-slate-400">
            <th class="py-2">المنتج</th>
            <th class="py-2">السعر</th>
          </tr>
        </thead>
        <tbody id="invoiceBody"></tbody>
      </table>
    </div>
    <div class="border-t border-slate-200 dark:border-slate-600 pt-3 space-y-1">
      <div class="flex justify-between"><span>المجموع</span><span id="subtotal"></span></div>
      <div id="discountRow" class="hidden flex justify-between text-emerald-600"><span>خصم الكوبون (50%)</span><span id="discountVal"></span></div>
      <div class="flex justify-between font-bold text-lg"><span>الإجمالي</span><span id="total"></span></div>
    </div>
    <div>
      <button id="couponToggle" type="button" class="text-blue-600 dark:text-blue-400 underline text-sm">have coupon</button>
      <div id="couponBox" class="hidden mt-2 flex gap-2">
        <input id="couponInput" type="text" placeholder="اكتب الكوبون"
               class="flex-1 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 px-3 py-2">
        <button id="couponApply" type="button" class="px-4 rounded-lg bg-blue-600 hover:bg-blue-700 text-white">تطبيق</button>
      </div>
      <p id="couponMsg" class="text-sm mt-1"></p>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
